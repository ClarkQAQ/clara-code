name: Publish GitHub Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    if: github.ref == 'refs/heads/master' && !github.event.deleted
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify source
        run: make check

      - name: Resolve release version
        id: version
        run: |
          commit_count="$(git rev-list --count HEAD)"
          revision="$(git rev-parse HEAD)"
          test "$revision" = "$GITHUB_SHA"
          version="r${commit_count}.g${revision:0:12}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build and verify archives
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash .github/scripts/build-release.sh "$RUNNER_TEMP/clara-release"

      - name: Upload verified archives
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clara-release
          path: ${{ runner.temp }}/clara-release/
          if-no-files-found: error
          overwrite: true
          compression-level: 0

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: clara-code-github-release-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - name: Checkout publishing script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download verified archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: clara-release
          path: ${{ runner.temp }}/clara-release/

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: bash .github/scripts/publish-release.sh "$RUNNER_TEMP/clara-release"
