name: publish packages

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: clara-code-publish-master
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/master'
    runs-on: default
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify source
        run: |
          test -z "$(gofmt -l main.go internal pkg examples)"
          go vet ./...
          go test ./...
          go test -race ./...

      - name: Resolve release version
        run: |
          commit_count="$(git rev-list --count HEAD)"
          revision="$(git rev-parse HEAD)"
          version="r${commit_count}.g${revision:0:12}"
          {
            echo "VERSION=$version"
            echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)"
          } >> "$GITHUB_ENV"
          echo "Building Clara Code $version"

      - name: Build and verify packages
        run: bash .forgejo/scripts/build-packages.sh

      - name: Publish packages and update Homebrew Tap
        env:
          FORGEJO_USER: clark
          HOMEBREW_TAP: homebrew-clara-code
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: bash .forgejo/scripts/publish-packages.sh
